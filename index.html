function pic(file,max,q,rm){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext("2d");x.drawImage(i,0,0,c.width,c.height);

function watchMe(){if(unA)unA();unA=null;if(!me||isAdm())return;
unA=dc("accounts",me.u).onSnapshot(s=>{if(!s.exists)return;const d=s.data(),chg=d.rights!=null&&(d.rights||0)!==myR;myR=d.rights||0;

async function load(){

const[pl,s]=await Promise.all([g(col("products")),dc("settings","shop").get().catch(()=>({exists:false}))]);prods=pl.sort((a,b)=>b.at-a.at);shop=s.exists?s.data():{};
if(isAdm()){const[o,si,ke,ac,ev]=await Promise.all([g(col("orders")),g(col("sites")),g(col("keys")),g(col("accounts")),g(col("events").orderBy("at","desc").limit(60))]);orders=o.sort((a,b)=>b.at-a.at);sites=si;keys=ke;accts=ac.sort((a,b)=>(b.at||0)-(a.at||0));evs=ev}
else if(me){const[o,si,a]=await Promise.all([g(col("orders").where("u","==",me.u)),g(col("sites").where("owner","==",me.u)),dc("accounts",me.u).get().catch(()=>({exists:false}))]);orders=o.sort((a,b)=>b.at-a.at);sites=si;myR=a.exists?(a.data().rights||0):0}

}
function applyTheme(){const s=document.documentElement.style,set=(k,v)=>v?s.setProperty(k,v):s.removeProperty(k),T=shop.tx||"#000";

set("--cd",shop.bg||"");set("--bd",shop.bg?`color-mix(in srgb,${T} 14%,${shop.bg})`:"");set("--mu",shop.tx?`color-mix(in srgb,${shop.tx} 55%,${shop.bg||"#fff"})`:"");
if(shop.name)document.title=shop.name}

function authUI(up){modal(`<div class="ac" style="margin-bottom:10px"><button class="b sm ${up?"s":""}" onclick="authUI(0)">เข้าสู่ระบบ</button><button class="b sm ${up?"":"s"}" onclick="authUI(1)">สมัครสมาชิก</button></div>${up&&+shop.welcome>0?`<div class="gift mu">${ic("gift",18)}<span>สมัครใหม่รับสิทธิ์ฟรี ${+shop.welcome} สิทธิ์ (${rvTxt()})</span></div>`:""}<input id="au" placeholder="ชื่อผู้ใช้" autocapitalize="none"><input id="ap" type="password" placeholder="รหัสผ่าน (อย่างน้อย 4 ตัว)"><button class="b f" onclick="doAuth(${up})">${up?"สมัครสมาชิก":"เข้าสู่ระบบ"}</button>`)}
const doAuth=up=>run(async()=>{
const u=$("#au").value.trim(),pw=$("#ap").value,adm=u.toLowerCase()=="admin";
if(!/^[A-Za-z0-9_.-]{4,30}$/.test(u))return say("ชื่อผู้ใช้ 4-30 ตัว (A-Z a-z 0-9 _ . -)");
if(pw.length<4)return say("รหัสผ่านอย่างน้อย 4 ตัว");
if(adm){
if(up)return say("ชื่อนี้ใช้ไม่ได้");
const s=await dc("admin","admin").get();if(!s.exists)return say("ยังไม่ได้ตั้งรหัสผู้ดูแล");
const d=s.data();if(d.hash!==await sha(pw,d.salt))return say("รหัสผ่านไม่ถูกต้อง");
me={u:"admin",role:"admin"};tab="admin";
}else{
const r=dc("accounts",u),s=await r.get();
if(up){if(s.exists)return say("ชื่อนี้ถูกใช้แล้ว");const salt=rs(),w=Math.max(0,+shop.welcome||0);await r.set({hash:await sha(pw,salt),salt,at:Date.now(),rights:w,...(w>0?{gift:{n:w,at:Date.now(),kind:"welcome"}}:{})})}
else{if(!s.exists)return say("ไม่พบชื่อผู้ใช้");const d=s.data();if(d.hash!==await sha(pw,d.salt))return say("รหัสผ่านไม่ถูกต้อง");if(d.banned)return say("บัญชีนี้ถูกระงับ")}
me={u,role:"user"};
logEv(up?"reg":"login",up?"สมัครสมาชิกใหม่":"เข้าสู่ระบบ");
}
localStorage.setItem("tpl_sess",JSON.stringify(me));closeM();await load();render();say("เข้าสู่ระบบสำเร็จ",1);
isAdm()?watchAdmin():watchMe();
});
function logout(){if(unE)unE();if(unA)unA();unE=unA=null;me=null;myR=0;localStorage.removeItem("tpl_sess");tab="shop";orders=[];sites=[];keys=[];$("#bt").innerHTML="";render()}
function setupUI(){modal(`<h3 style="margin:0 0 6px;font-weight:500">ตั้งรหัสผู้ดูแล</h3><div class="mu">ตั้งรหัสสำหรับชื่อ admin ครั้งแรก แล้วเข้าสู่ระบบด้วยชื่อ admin</div><input id="spw" type="password" placeholder="รหัสผ่าน (อย่างน้อย 8 ตัว)"><button class="b f" onclick="doSetup()">ตั้งรหัส</button>`)}

/* ===== สินค้า ===== */
const stk=p=>p.stock==null?"":p.stock<=0?'<span class="chip er" style="margin:3px 3px 0 0">สินค้าหมด</span>':`<span class="chip ${p.stock<=5?"er":""}" style="margin:3px 3px 0 0">เหลือ ${p.stock} ชิ้น</span>`;
const bxo=p=>p.bd=="rainbow"?'class="bx rb"':p.bd?`class="bx c1" style="--b:${esc(p.bd)}"`:'class="bx"';
const shopUI=()=>{const hasHot=prods.some(p=>!p.hide&&p.hot);
let L=prods.filter(p=>!p.hide&&(cf=="__hot"?p.hot:(!cf||p.cat==cf)));L=[...L.filter(p=>p.hot),...L.filter(p=>!p.hot)];
const gift=me&&!isAdm()?(myR>0?`<div class="gift">${ic("gift",20)}<div><b style="font-weight:500">คุณมีสิทธิ์ฟรี ${myR} สิทธิ์</b><div class="mu">${rvTxt()} · เลือกสไตล์ที่มีป้ายใช้สิทธิ์ฟรีได้ แล้วกดรับฟรี</div></div></div>`:""):(+shop.welcome>0?`<div class="gift">${ic("gift",20)}<div><b style="font-weight:500">สมัครสมาชิกใหม่รับฟรี ${+shop.welcome} สิทธิ์</b><div class="mu">${rvTxt()} · <a href="#" onclick="authUI(1);return false" style="color:var(--tx)">สมัครเลย</a></div></div></div>`:"");
const nav=cats().length||hasHot?`<nav>${["",...(hasHot?["__hot"]:[]),...cats()].map(c=>`<button class="b sm ${cf==c?"":"s"}" onclick="cf=this.dataset.c;render()" data-c="${esc(c)}">${c==""?"ทั้งหมด":c=="__hot"?"ยอดฮิต":esc(c)}</button>`).join("")}</nav>`:"";
return gift+nav+(L.length?`<div class="g">${L.map((p,i)=>`<div class="p" style="--i:${i}" onclick="buyUI('${p.id}')"><div ${bxo(p)}><div class="in"><div class="im" style="background-image:url('${esc(p.img||"")}')">${p.hot?`<span class="hot">${ic("flame",13)}ยอดฮิต</span>`:""}${soldOut(p)?'<div class="so">หมด</div>':""}</div><div class="t"><b>${esc(p.name)}</b><div class="pr" ${p.pcol?`style="color:${esc(p.pcol)}"`:""}>${p.price} บาท</div>${stk(p)}${me&&!isAdm()&&canRight(p)?`<span class="chip ok" style="margin-top:3px">${ic("gift",12)}ใช้สิทธิ์ฟรีได้</span>`:""}</div></div></div></div>`).join("")}</div>`:'<div class="c mu">ยังไม่มีสไตล์</div>')};
function buyUI(id){
const p=prods.find(x=>x.id==id);if(!p)return;
if(!isAdm())logEv("view","กดดูสไตล์ "+p.name);
if(!me){authUI(0);return say("เข้าสู่ระบบก่อน")}
if(isAdm())return say("ผู้ดูแลซื้อไม่ได้ ใช้บัญชีลูกค้าแทน");
const html=build(p.tpl,fieldsOf(p.fields),p.defs||{});
const rt=myR>0?(canRight(p)?`<div class="gift">${ic("gift",20)}<div style="flex:1"><b style="font-weight:500">มีสิทธิ์ฟรี ${myR} สิทธิ์</b><div class="mu">${rvTxt()}</div><button class="b f" onclick="useRight('${p.id}')">รับสไตล์นี้ฟรี (ใช้ 1 สิทธิ์)</button></div></div>`:`<div class="c mu">คุณมี ${myR} สิทธิ์ แต่สไตล์นี้ราคาเกิน ${rvTxt()}</div>`):"";
const buy=soldOut(p)?`<div class="c"><h3>สินค้าหมดแล้ว</h3><div class="mu" style="margin-bottom:6px">ติดต่อแอดมินเพื่อสอบถามรอบถัดไป</div>${lineBtn("f")}</div>`:`${rt}
<div class="c"><h3>ใส่โค้ดที่ซื้อมา</h3><input id="kc" placeholder="XXXX-XXXX-XXXX" autocapitalize="characters"><button class="b f" onclick="redeem('${p.id}')">ยืนยันโค้ด</button></div>
<div class="c"><h3>ยังไม่มีโค้ด</h3>${shop.lmsg?`<div class="lm">${esc(shop.lmsg)}</div>`:""}${lineBtn("f")}</div>`;
modal(`<h3 style="margin:0;font-weight:500">${esc(p.name)} ${p.hot?`<span class="chip" style="color:#e8590c;border-color:#e8590c">${ic("flame",12)}ยอดฮิต</span>`:""}</h3><div id="pg"></div><div class="mu">${esc(p.desc||"")}</div><iframe class="pv" sandbox="allow-scripts" srcdoc="${esc(html)}"></iframe><div class="mu">ปรับแต่งได้ ${p.edits||3} ครั้ง · เปิดเว็บถาวร</div><div style="margin:6px 0;font-size:20px;font-weight:500;${p.pcol?`color:${esc(p.pcol)}`:""}">${p.price} บาท</div>${stk(p)}${buy}`);

}
const redeem=pid=>run(async()=>{
const c=$("#kc").value.trim().toUpperCase();if(!c)return say("กรอกโค้ด");
const oref=col("orders").doc();const p=prods.find(x=>x.id==pid);
await R.runTransaction(async t=>{
const kr=dc("keys",c),pr=dc("products",pid),k=await t.get(kr),ps=await t.get(pr);
if(!k.exists||k.data().used)throw Error("โค้ดไม่ถูกต้องหรือถูกใช้แล้ว");
if(k.data().pid&&k.data().pid!=="*"&&k.data().pid!==pid)throw Error("โค้ดนี้ใช้กับสไตล์อื่น");
const st=ps.exists?ps.data().stock:null;if(st!=null&&st<=0)throw Error("สินค้าหมดแล้ว");
t.update(kr,{used:true,usedBy:me.u,usedAt:Date.now()});
if(st!=null)t.update(pr,{stock:st-1});
t.set(oref,{u:me.u,pid,pname:p.name,price:p.price,status:"paid",method:"key",at:Date.now()});
});
logEv("buy","สั่งซื้อ "+p.name+" ด้วยโค้ด");
await load();render();setupUI2(oref.id);
});
const useRight=pid=>run(async()=>{
const p=prods.find(x=>x.id==pid);if(!p||!canRight(p))return say("ใช้สิทธิ์กับสไตล์นี้ไม่ได้");
const oref=col("orders").doc();
await R.runTransaction(async t=>{
const ar=dc("accounts",me.u),pr=dc("products",pid),a=await t.get(ar),ps=await t.get(pr);
if(!a.exists||(a.data().rights||0)<1)throw Error("สิทธิ์ไม่พอ");
const st=ps.exists?ps.data().stock:null;if(st!=null&&st<=0)throw Error("สินค้าหมดแล้ว");
t.update(ar,{rights:a.data().rights-1});
if(st!=null)t.update(pr,{stock:st-1});
t.set(oref,{u:me.u,pid,pname:p.name,price:p.price,status:"paid",method:"right",at:Date.now()});
});
logEv("buy","ใช้สิทธิ์ฟรีรับ "+p.name);
await load();render();setupUI2(oref.id);
});

const setupUI2=oid=>modal(`<h3 style="margin:0 0 6px;font-weight:500">ตั้งชื่อเว็บของคุณ</h3><div class="mu">ตั้งชื่อซ้ำกับคนอื่นได้ ลิงก์จะสั้นและสุ่มให้อัตโนมัติ</div><input id="sg" placeholder="เช่น เว็บขอแฟน" autocapitalize="none"><button class="b f" onclick="makeSite('${oid}')">เปิดเว็บ</button>`);
const makeSite=oid=>run(async()=>{

if(!nm)return say("ตั้งชื่อเว็บก่อน");

});

function editUI(){
const s=ed.s,fl=fieldsOf(s.fields);
return `<div class="c"><h3>${ed.adm?"ตั้งค่าเริ่มต้น":"ปรับแต่ง"}: ${esc(s.pname)}</h3><div class="mu">${ed.adm?"แก้ข้อความ/รูป/สี แบบเดียวกับที่ลูกค้าแก้ · สิ่งที่คุณตั้งตรงนี้จะเป็นค่าเริ่มต้นของสินค้านี้ ลูกค้าที่ซื้อจะเห็นแบบนี้ก่อน แล้วค่อยแก้ต่อได้":`สิทธิ์แก้ไขเหลือ <b>${s.editsLeft}</b> ครั้ง (กดบันทึก 1 ครั้ง = ใช้ 1 สิทธิ์) หมดแล้วต้องขอโค้ดใหม่`}</div><iframe class="pv" id="pv" sandbox="allow-scripts" srcdoc="${esc(build(s.tpl,fl,ed.v))}"></iframe>${fl.map(f=>{const v=ed.v[f.k]??"";return `<label class="mu">${esc(f.l)}</label>`+(f.t=="a"?`<textarea style="font-family:inherit;font-size:15px" data-k="${f.k}" oninput="edV(this)">${esc(v||f.d)}</textarea>`:f.t=="c"?`<input type="color" data-k="${f.k}" value="${/^#[0-9a-f]{6}$/i.test(v||f.d)?v||f.d:"#000000"}" oninput="edV(this)">`:f.t=="i"?`<label class="mu" style="display:block"><input type="checkbox" id="rm_${f.k}"> ลบพื้นหลังรูป (ใช้กับรูปนิ่งเท่านั้น · ติ๊กก่อนเลือกรูป · เหมาะกับพื้นหลังสีเดียว) · รับรูป GIF/WebP ขยับ และวิดีโอสั้น (ไฟล์ไม่เกิน 600 KB)</label><input type="file" accept="image/*,video/*" data-k="${f.k}" onchange="edI(this)">`:`<input data-k="${f.k}" value="${esc(v||f.d)}" oninput="edV(this)">`)}).join("")}${ed.adm?`<button class="b f" onclick="saveDefs()">บันทึกเป็นค่าเริ่มต้น</button><button class="b s f" onclick="admBack()">กลับ</button>`:`<button class="b f" ${s.editsLeft<=0?"disabled":""} onclick="saveEdit()">บันทึก (ใช้ 1 สิทธิ์)</button><button class="b s f" onclick="go('mine')">กลับ</button>`}</div>`;
}
const edPrev=()=>{const s=ed.s;$("#pv").srcdoc=build(s.tpl,fieldsOf(s.fields),ed.v)};
const edV=el=>{ed.v[el.dataset.k]=el.value;edPrev()};
const LIM=600*1024;
const rdURL=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error("อ่านไฟล์ไม่ได้"));r.readAsDataURL(f)});
const edI=async el=>{const f=el.files[0];if(!f)return;try{
const vid=/^video\//.test(f.type),gif=f.type=="image/gif",wp=f.type=="image/webp"&&f.size<=LIM;
if(vid||gif||wp){
if(f.size>LIM){el.value="";return say("ไฟล์ใหญ่เกินไป ("+Math.round(f.size/1024)+" KB) ต้องไม่เกิน 600 KB ลดความยาว/ขนาดคลิป หรือใช้ช่องลิงก์แทน")}
ed.v[el.dataset.k]=await rdURL(f)}
else ed.v[el.dataset.k]=await pic(f,700,.72,$("#rm_"+el.dataset.k)?.checked?55:0);
edPrev();
if(JSON.stringify(ed.v).length>95e4)say("รวมไฟล์ใหญ่เกินกำหนดของฐานข้อมูล บันทึกไม่ได้ ลองลดจำนวนไฟล์หรือใช้ช่องลิงก์แทน")
}catch(e){say(ERR(e))}};
const saveEdit=()=>run(async()=>{
const s=ed.s;
if(JSON.stringify(ed.v).length>95e4)return say("ไฟล์รวมใหญ่เกินไป (เกิน 1 MB ของฐานข้อมูล) ลดจำนวน/ขนาดไฟล์ หรือใช้ช่องลิงก์แทน");
await R.runTransaction(async t=>{
const r=dc("sites",s.id),d=await t.get(r);
if(!d.exists||d.data().owner!==me.u)throw Error("ไม่พบเว็บ");
if(d.data().editsLeft<=0)throw Error("หมดสิทธิ์แก้ไขแล้ว");
t.update(r,{vals:ed.v,editsLeft:d.data().editsLeft-1,upd:Date.now()});
});
logEv("edit","แก้ไขเว็บ "+s.id);
await load();ed=null;go("mine");say("บันทึกแล้ว เว็บอัปเดตทันที",1);
});

/* ===== รูป/วิดีโอของสินค้า (แอดมิน) ===== */
let MS=[];
const gm=async pid=>(await col("media").where("pid","==",pid).get()).docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.at-b.at);
const shrink=(src,max,q)=>new Promise(ok=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL(/^data:image\/png/.test(src)?"image/png":"image/jpeg",q))};i.onerror=()=>ok(src);i.src=src});
const ytId=u=>(String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/)||[])[1];
const mediaUI=id=>run(async()=>{
const p=prods.find(x=>x.id==id);if(!p)return;
let ms=await gm(id);
if(p.img&&!ms.some(m=>m.id==p.cover)){const r=await col("media").add({pid:id,type:"img",src:p.img,at:Math.min(p.at||Date.now(),Date.now())-1});await dc("products",id).update({cover:r.id});p.cover=r.id;ms.unshift({id:r.id,pid:id,type:"img",src:p.img,at:0})}
MS=ms;
const L=[...ms.filter(m=>m.id==p.cover),...ms.filter(m=>m.id!=p.cover)];
const tile=m=>{const c=m.id==p.cover,y=m.type=="vid"?ytId(m.src):"",th=m.type=="img"?m.src:(y?"https://img.youtube.com/vi/"+y+"/hqdefault.jpg":"");

const setCover=(pid,mid)=>run(async()=>{const m=MS.find(x=>x.id==mid);if(!m)return;await dc("products",pid).update({img:await shrink(m.src,600,.72),cover:mid});await load();render();say("ตั้งรูปเริ่มต้นแล้ว",1)}).then(()=>mediaUI(pid));
const delMedia=(pid,mid)=>{if(!confirm("ลบรายการนี้?"))return;run(async()=>{const p=prods.find(x=>x.id==pid);await dc("media",mid).delete();if(p&&p.cover==mid){const n=MS.find(x=>x.id!=mid&&x.type=="img");await dc("products",pid).update(n?{img:await shrink(n.src,600,.72),cover:n.id}:{img:"",cover:""})}await load();render()}).then(()=>mediaUI(pid))};
const addImgs=pid=>run(async()=>{const fs=[...$("#mf").files];if(!fs.length)return say("เลือกรูปก่อน");
const rm=$("#mr").checked,p=prods.find(x=>x.id==pid);let n=0,has=!!p.cover&&MS.some(m=>m.id==p.cover);
for(const f of fs){const s=await pic(f,rm?600:800,.72,rm?55:0);if(s.length>900000){say("รูป "+f.name+" ใหญ่เกินไป");continue}
const r=await col("media").add({pid,type:"img",src:s,at:Date.now()+n});n++;
if(!has){await dc("products",pid).update({img:await shrink(s,600,.72),cover:r.id});has=true}}
await load();render();if(n)say("เพิ่ม "+n+" รูปแล้ว",1)}).then(()=>mediaUI(pid));
const addVid=pid=>run(async()=>{const u=$("#mv").value.trim();if(!/^https?:\/\//i.test(u))return say("ใส่ลิงก์ที่ขึ้นต้นด้วย http");
await col("media").add({pid,type:"vid",src:u,at:Date.now()});say("เพิ่มวิดีโอแล้ว",1)}).then(()=>mediaUI(pid));

const PROPOSE_T="<!DOCTYPE html><html lang=\"th\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><title>{{name}} {{q}}<\/title>\n<style>\n*{box-sizing:border-box}html,body{margin:0;height:100%}\nbody{background:{{bg}};font-family:system-ui,sans-serif;color:#222;overflow:hidden;display:flex;align-items:center;justify-content:center}\n#bgm{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}\n#bgo{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:0}\nmain{position:relative;z-index:1;width:min(88vw,360px);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0;transform:scale(.95);transition:opacity 1s cubic-bezier(.4,0,.2,1),transform 1s cubic-bezier(.4,0,.2,1)}\nmain.show{opacity:1;transform:scale(1)}\n#mb{width:min(64vw,240px);aspect-ratio:1;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;position:relative;animation:fl 3.5s ease-in-out infinite}\n#mb img,#mb video,#mb svg,#mb canvas{width:100%;height:100%;object-fit:contain;object-position:center;display:block;margin:auto}\n#mb video.hv{position:absolute;width:1px!important;height:1px!important;opacity:0;pointer-events:none}\n@keyframes fl{50%{transform:translateY(-6px)}}\n.card{background:#ffffffe6;border-radius:20px;padding:18px 16px;width:100%}\nh1{margin:0 0 6px;font-size:22px;font-weight:600;line-height:1.35}\n#msg{min-height:22px;font-size:15px;color:#666;margin:0 0 14px}\n.bt{display:flex;gap:12px;justify-content:center;align-items:center;min-height:56px}\nbutton{font:inherit;font-weight:600;border:0;border-radius:99px;padding:12px 28px;cursor:pointer;transition:transform .2s}\n#y{background:{{ac}};color:#fff}#n{background:#fff;color:#444;border:1px solid #ddd}\n.ht{position:fixed;bottom:-30px;width:14px;height:14px;transform:rotate(45deg);z-index:2;pointer-events:none;animation:up 3s ease-in forwards}\n.ht::before,.ht::after{content:\"\";position:absolute;width:14px;height:14px;border-radius:50%;background:inherit}\n.ht::before{left:-7px}.ht::after{top:-7px}\n@keyframes up{to{transform:translateY(-110vh) rotate(45deg);opacity:0}}\n\n/* ===== อนิเมชั่นหัวใจตอนเข้าเว็บ (จากเว็บที่สอง) ===== */\n#heart-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9999;pointer-events:none;will-change:opacity}\n.pop-heart{position:absolute;will-change:transform,opacity;animation:ultraSmoothPop .3s cubic-bezier(.175,.885,.32,1.275) forwards}\n.pop-heart svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}\n@keyframes ultraSmoothPop{0%{transform:scale(0) rotate(var(--rot,0deg));opacity:0}70%{transform:scale(1.15) rotate(var(--rot,0deg));opacity:1}100%{transform:scale(1) rotate(var(--rot,0deg));opacity:1}}\n.fade-out-smooth{transition:opacity .8s cubic-bezier(.4,0,.2,1);opacity:0!important}\n<\/style><\/head><body>\n<div id=\"heart-overlay\"><\/div>\n<div id=\"cfg\" hidden data-ac=\"{{ac}}\" data-ytxt=\"{{ytxt}}\" data-ntxt=\"{{ntxt}}\" data-sad=\"{{sad}}\" data-hap=\"{{hap}}\" data-mimg=\"{{mimg}}\"\n data-mvid=\"https://www.image2url.com/r2/default/videos/1792067752348-c744e97d-0a50-471b-b571-f62a528bc6f3.mov\"\n data-himg=\"https://www.image2url.com/r2/default/videos/1792067713553-aa7d78ba-783b-49a7-ba84-f9de24958600.mov\"\n data-s1=\"https://www.image2url.com/r2/default/videos/1792067036442-7638cb3a-2e5c-46d0-a8b9-55ce2a552406.mov\"\n data-s2=\"https://www.image2url.com/r2/default/videos/1792067085447-3b355431-c2b9-4a77-89f4-eddf90eacb5e.mov\"\n data-s3=\"https://www.image2url.com/r2/default/videos/1792067123416-fee700be-476d-4f6e-9e1b-caded40b2c42.mov\"\n data-s4=\"https://www.image2url.com/r2/default/videos/1792067153480-4c210c20-6f08-4f39-a94c-b0ab22368d8f.mov\"\n data-bimg=\"{{bimg}}\" data-bvid=\"{{bvid}}\"><\/div>\n<main id=\"mainBox\">\n<div class=\"card\">\n<div id=\"mb\"><\/div>\n<h1 id=\"t\">{{name}} {{q}}<\/h1><p id=\"msg\"><\/p>\n<div class=\"bt\"><button id=\"y\">{{yes}}<\/button><button id=\"n\">{{no}}<\/button><\/div>\n<\/div><\/main>\n<script>\nvar C=document.getElementById('cfg').dataset,$=function(i){return document.getElementById(i)};\nvar L=function(s){return(s||'').split(',').map(function(x){return x.trim()}).filter(Boolean)};\nvar NT=L(C.ntxt);\nvar SAD=[C.s1,C.s2,C.s3,C.s4].filter(Boolean).concat(L(C.sad));\nvar HAP=[C.himg].filter(Boolean).concat(L(C.hap));\nvar IDLE=C.mvid||C.mimg;\nvar isV=function(u){return /\\.(mp4|webm|mov)(\\?|$)/i.test(u)||/^data:video/.test(u)};\nfunction face(m){var e=m=='h'?'<path d=\"M30 42q6-8 12 0M58 42q6-8 12 0\" fill=\"none\" stroke=\"#333\" stroke-width=\"3\" stroke-linecap=\"round\"/>':'<circle cx=\"36\" cy=\"42\" r=\"4\" fill=\"#333\"/><circle cx=\"64\" cy=\"42\" r=\"4\" fill=\"#333\"/>';\nvar o=m=='h'?'<path d=\"M34 60q16 18 32 0z\" fill=\"#e0405f\"/>':m=='s'?'<path d=\"M38 68q12-12 24 0\" fill=\"none\" stroke=\"#333\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M30 50q-3 8 0 12q3-4 0-12M70 50q3 8 0 12q-3-4 0-12\" fill=\"#4dabf7\"/>':'<path d=\"M38 62q12 10 24 0\" fill=\"none\" stroke=\"#333\" stroke-width=\"3\" stroke-linecap=\"round\"/>';\nreturn '<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"52\" r=\"34\" fill=\"#ffd54a\"/>'+e+o+'<\/svg>'}\n\n/* วิดีโอลบพื้นหลัง: เอาสีมุมภาพเป็นสีพื้นหลังแล้วทำให้โปร่งใส */\nfunction keyedVideo(u,box){\nvar v=document.createElement('video');v.crossOrigin='anonymous';\nv.muted=v.loop=v.autoplay=v.playsInline=true;v.setAttribute('playsinline','');v.className='hv';\nvar cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true}),fb=false;\nfunction fallback(){if(fb)return;fb=true;if(cv.parentNode)cv.remove();\nv.className='';v.style.mixBlendMode='multiply'; /* สำรอง: ตัดพื้นขาวด้วย blend */\nif(v.crossOrigin){v.removeAttribute('crossorigin');v.src=u;}\nvar p=v.play();if(p&&p.catch)p.catch(function(){})}\nv.onerror=function(){if(v.crossOrigin&&!fb)fallback()};\nv.src=u;box.appendChild(cv);box.appendChild(v);\nvar pl=v.play();if(pl&&pl.catch)pl.catch(function(){});\nfunction draw(){\nif(!v.isConnected||fb)return;\nif(v.readyState>=2&&v.videoWidth){\nvar s=Math.min(1,360/v.videoWidth),w=Math.round(v.videoWidth*s),h=Math.round(v.videoHeight*s);\nif(cv.width!=w||cv.height!=h){cv.width=w;cv.height=h}\ncx.drawImage(v,0,0,w,h);\ntry{\nvar d=cx.getImageData(0,0,w,h),p=d.data,pts=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]],r=0,g=0,b=0,a=0;\npts.forEach(function(q){var i=(q[1]*w+q[0])*4;r+=p[i];g+=p[i+1];b+=p[i+2];a+=p[i+3]});\nr/=4;g/=4;b/=4;a/=4;\nif(a>200){\nfor(var i=0;i<p.length;i+=4){\nvar dr=p[i]-r,dg=p[i+1]-g,db=p[i+2]-b,dist=Math.sqrt(dr*dr+dg*dg+db*db);\nif(dist<60)p[i+3]=0;else if(dist<110)p[i+3]=(dist-60)/50*255}\ncx.putImageData(d,0,0)}\n}catch(e){fallback();return}\n}\nrequestAnimationFrame(draw)}\nrequestAnimationFrame(draw)}\n\nfunction put(u,m){var b=$('mb');b.innerHTML='';\nif(!u){b.innerHTML=face(m);return}\nif(isV(u)){keyedVideo(u,b);return}\nvar e=document.createElement('img');e.src=u;b.appendChild(e)}\nfunction mk(u){var e;if(isV(u)){e=document.createElement('video');e.autoplay=e.loop=e.muted=e.playsInline=true;e.setAttribute('playsinline','')}else e=document.createElement('img');e.src=u;return e}\nvar pick=function(a){return a[Math.floor(Math.random()*a.length)]};\nput(IDLE,'i');\nvar bu=C.bvid||C.bimg;\nif(bu&&bu.indexOf('{{')<0){var g=mk(bu);g.id='bgm';document.body.prepend(g);var o=document.createElement('div');o.id='bgo';document.body.prepend(o)}\nvar k=0,yy=1,last=-1;\n$('n').onclick=function(){\nvar i=0;if(SAD.length>1){do{i=Math.floor(Math.random()*SAD.length)}while(i===last)}last=i;\nput(SAD[i],'s');\n$('msg').textContent=NT.length?NT[k%NT.length]:'';k++;\nyy=Math.min(yy+.12,1.7);$('y').style.transform='scale('+yy+')';\nvar n=$('n'),w=n.offsetWidth,h=n.offsetHeight;\nn.style.position='fixed';n.style.zIndex=5;\nn.style.left=Math.random()*(innerWidth-w-24)+12+'px';\nn.style.top=Math.random()*(innerHeight-h-24)+12+'px'};\n$('y').onclick=function(){\nput(HAP.length?pick(HAP):'','h');\n$('t').textContent=C.ytxt;$('msg').textContent='';\ndocument.querySelector('.bt').style.display='none';\nfor(var i=0;i<24;i++){var d=document.createElement('i');d.className='ht';d.style.left=Math.random()*100+'vw';d.style.animationDelay=Math.random()*1.5+'s';d.style.background=C.ac;document.body.appendChild(d)}};\n\n/* ===== อนิเมชั่นหัวใจแปะเต็มจอตอนเข้าเว็บ ===== */\n(function(){\nvar overlay=$('heart-overlay'),mainBox=$('mainBox');\nvar svg='<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M50 88.5 S15 60 15 33 A20 20 0 0 1 50 22 A20 20 0 0 1 85 33 C85 60 50 88.5 50 88.5 Z\" fill=\"#ff2a5f\" stroke=\"#ffffff\" stroke-width=\"7\" stroke-linejoin=\"round\"/><\/svg>';\nvar spacing=45,cols=Math.ceil(innerWidth/spacing)+2,rows=Math.ceil(innerHeight/spacing)+2,pos=[];\nfor(var r=-1;r<rows;r++)for(var c=-1;c<cols;c++)pos.push({x:c*spacing+(Math.random()*30-15),y:r*spacing+(Math.random()*30-15)});\npos.sort(function(){return Math.random()-.5});\nvar idx=0;\nfunction pop(){\nif(idx<pos.length){\nvar p=pos[idx],h=document.createElement('div');h.className='pop-heart';h.innerHTML=svg;\nvar size=100+Math.random()*50;h.style.width=h.style.height=size+'px';\nh.style.setProperty('--rot',(Math.random()*90-45).toFixed(1)+'deg');\nh.style.left=(p.x-size/2)+'px';h.style.top=(p.y-size/2)+'px';\noverlay.appendChild(h);idx++;setTimeout(pop,12)}\nelse{setTimeout(function(){overlay.classList.add('fade-out-smooth');mainBox.classList.add('show');setTimeout(function(){overlay.remove()},800)},400)}}\npop()})();\n<\/script><\/body><\/html>\n";
function prodForm(id){
const p=prods.find(x=>x.id==id)||{fields:SAMPLE_F,tpl:SAMPLE_T,edits:3},L=[...cats()];if(p.cat&&!L.includes(p.cat))L.push(p.cat);
const rb=p.bd=="rainbow",hx=/^#[0-9a-f]{6}$/i;
modal(`<h3 style="margin:0 0 6px;font-weight:500">${id?"แก้ไข":"เพิ่ม"}สไตล์เว็บ</h3><input id="pn" placeholder="ชื่อสไตล์" value="${esc(p.name||"")}"><label class="mu">หมวดหมู่ (ไม่บังคับ · เพิ่มหมวดที่แท็บหมวดหมู่)</label><select id="pc"><option value="">ไม่มีหมวด</option>${L.map(c=>`<option ${p.cat==c?"selected":""}>${esc(c)}</option>`).join("")}</select><input id="pp" type="number" placeholder="ราคา (บาท)" value="${p.price??""}"><input id="ps" type="number" min="0" placeholder="สต๊อก (ชิ้น) เว้นว่าง = ไม่จำกัด" value="${p.stock??""}"><input id="pe" type="number" placeholder="สิทธิ์แก้ไข (ครั้ง)" value="${p.edits||3}">
<label class="mu" style="display:block;margin-top:6px"><input type="checkbox" id="ph" ${p.hot?"checked":""}> ตั้งเป็นสินค้ายอดฮิต</label>
<label class="mu" style="display:block;margin-top:6px"><input type="checkbox" id="pco" ${p.pcol?"checked":""}> เปลี่ยนสีราคา</label><input id="pcv" type="color" value="${hx.test(p.pcol||"")?p.pcol:"#e8590c"}">
<label class="mu" style="display:block;margin-top:6px"><input type="checkbox" id="pbo" ${p.bd?"checked":""}> ใส่สีขอบสินค้า (ไม่ติ๊ก = ไม่มีสีขอบ)</label><select id="pbt"><option value="c" ${rb?"":"selected"}>สีเดียว (เลือกด้านล่าง)</option><option value="rb" ${rb?"selected":""}>สีรุ้ง</option></select><input id="pbc" type="color" value="${hx.test(p.bd||"")?p.bd:"#2fa8ff"}">
<textarea id="pd" style="font-family:inherit;font-size:15px;min-height:60px" placeholder="คำอธิบาย">${esc(p.desc||"")}</textarea><label class="mu">รูปปก${p.img?" (มีแล้ว เลือกใหม่เพื่อเปลี่ยน)":""}</label><label class="mu" style="display:block"><input type="checkbox" id="pr"> ลบพื้นหลังรูปปก</label><input id="pm" type="file" accept="image/*"><label class="mu">ฟิลด์ที่ลูกค้าแก้ได้ (1 บรรทัด = key|ป้ายชื่อ|ชนิด t/a/c/i|ค่าเริ่มต้น)</label><textarea id="pf">${esc(p.fields||"")}</textarea><label class="mu">โค้ดเว็บ HTML ทั้งหน้า (ใช้ {{key}} ตรงที่ให้ลูกค้าแก้)</label><button type="button" class="b sm" style="margin:4px 0" onclick="$('#pt').value=PROPOSE_T;say('ใส่เทมเพลตขอแฟนแล้ว กดบันทึกด้านล่าง',1)">ใส่เทมเพลตขอแฟนให้อัตโนมัติ</button><textarea id="pt" style="min-height:200px">${esc(p.tpl||"")}</textarea><button class="b f" onclick="saveProd('${id}')">บันทึก</button>`);
}
const saveProd=id=>run(async()=>{
const name=$("#pn").value.trim(),price=+$("#pp").value,sv=$("#ps").value.trim();
if(!name||!(price>=0))return say("กรอกชื่อและราคา");
const d={name,cat:$("#pc").value,price,stock:sv===""?null:Math.max(0,Math.floor(+sv)||0),edits:+$("#pe").value||3,hot:$("#ph").checked,pcol:$("#pco").checked?$("#pcv").value:"",bd:$("#pbo").checked?($("#pbt").value=="rb"?"rainbow":$("#pbc").value):"",desc:$("#pd").value.trim(),fields:$("#pf").value,tpl:$("#pt").value};
if(d.tpl.length>700000)return say("โค้ดใหญ่เกินไป");
if(d.tpl.includes("tpl_sess"))return say("ช่องโค้ดมีโค้ดของร้านติดอยู่ กดปุ่ม ใส่เทมเพลตขอแฟนให้อัตโนมัติ ก่อน");
const f=$("#pm").files[0];if(f)d.img=await pic(f,600,.72,$("#pr").checked?55:0);
if(id)await dc("products",id).update(d);else{const r=await col("products").add({img:"",hide:false,...d,at:Date.now()});id=r.id}
if(f&&d.img){const m=await col("media").add({pid:id,type:"img",src:d.img,at:Date.now()});await dc("products",id).update({cover:m.id})}
closeM();await load();render();say("บันทึกแล้ว",1);
});
